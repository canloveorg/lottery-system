    <script type="module">
        // --- Config & Init ---
        const firebaseConfig = {
            apiKey: "AIzaSyCg0NXOZvHPXYodltR2fjZNXE29quibg58",
            authDomain: "lottery-system-534ed.firebaseapp.com",
            databaseURL: "https://lottery-system-534ed-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "lottery-system-534ed",
            storageBucket: "lottery-system-534ed.firebasestorage.app",
            messagingSenderId: "154076219882",
            appId: "1:154076219882:web:007fa4485355b005f98a93",
            measurementId: "G-D8BMY19YHV"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        
        // Robust DB Init (Explicit URL)
        let db;
        try {
            db = firebase.database(firebase.app(), firebaseConfig.databaseURL);
            console.log("Firebase Connected");
        } catch(e) {
            console.error("DB Init Failed", e);
            alert("Connection Failed. Using offline mode (changes won't save).");
        }

        // Festive Messages (No AI)
        const festiveMessages = [
            "祝您龍年行大運，財源滾滾來！",
            "恭喜發財，紅包拿來，歲歲平安！",
            "運氣好到擋不住，明年繼續發大財！",
            "天選之人就是您，鴻運當頭旺旺旺！",
            "福星高照，萬事如意，心想事成！"
        ];
        function getRandomMessage() {
            return festiveMessages[Math.floor(Math.random() * festiveMessages.length)];
        }

        // --- State ---
        const state = {
            participants: [],
            prizes: [],
            winners: [],
            selectedPrizeId: '',
            view: 'IDLE', // IDLE, DRAWING, REVEALED
            currentBatch: [],
            activeTabTimestamp: 0
        };

        // --- DOM Elements ---
        const els = {
            participantList: document.getElementById('list-participants'),
            participantCount: document.getElementById('count-participants'),
            stageParticipantCount: document.getElementById('count-participants-stage'),
            prizeList: document.getElementById('list-prizes'),
            prizeCount: document.getElementById('count-prizes'),
            
            // Forms
            addUserForm: document.getElementById('form-add-user'),
            inputName: document.getElementById('input-new-name'),
            inputTable: document.getElementById('input-new-table'),
            addPrizeForm: document.getElementById('form-add-prize'),
            inputPrizeName: document.getElementById('input-prize-name'),
            inputPrizeCount: document.getElementById('input-prize-count'),
            inputDrawCount: document.getElementById('input-draw-count'),

            // Views
            viewIdle: document.getElementById('view-idle'),
            viewDrawing: document.getElementById('view-drawing'),
            viewRevealed: document.getElementById('view-revealed'),
            statusBadge: document.getElementById('status-badge'),
            statusBadgeInner: document.getElementById('status-badge-inner'),

            // Drawing Elements
            rollingName: document.getElementById('rolling-name'),
            rollingTable: document.getElementById('rolling-table'),
            singleWinnerDisplay: document.getElementById('single-winner-display'),
            singleWinnerName: document.getElementById('single-winner-name'),
            singleWinnerTable: document.getElementById('single-winner-table'),
            batchWinnerDisplay: document.getElementById('batch-winner-display'),
            batchGrid: document.getElementById('batch-grid'),

            // Winners List
            winnerTabs: document.getElementById('winner-tabs'),
            winnerListContainer: document.getElementById('winner-list-container'),
        };

        // --- Render Functions ---

        function renderParticipants() {
            els.participantCount.textContent = state.participants.length;
            els.stageParticipantCount.textContent = state.participants.length;
            
            els.participantList.innerHTML = state.participants.map(p => `
                <div class="flex items-center gap-2 p-2 rounded-xl border transition-all bg-white/5 border-transparent hover:border-amber-500/20 group">
                    <div class="flex-1 min-w-0 pl-1">
                        <div class="flex justify-between items-center">
                            <div class="text-sm font-bold text-amber-100 truncate">${p.name}</div>
                            ${p.tableNumber ? `<div class="text-[10px] text-amber-500/60 font-bold flex items-center gap-0.5"><i data-lucide="armchair" class="w-3 h-3"></i> ${p.tableNumber}</div>` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function renderPrizes() {
            els.prizeCount.textContent = state.prizes.length;
            els.prizeList.innerHTML = state.prizes.map(p => {
                const isSelected = state.selectedPrizeId === p.id;
                return `
                <div onclick="window.selectPrize('${p.id}')" class="flex items-center gap-3 p-3 rounded-[1.5rem] border cursor-pointer transition-all group ${isSelected ? 'bg-red-700/40 border-amber-500/50' : 'bg-white/5 border-transparent hover:bg-white/10'}">
                    <div class="${isSelected ? 'bg-amber-500' : 'bg-white/20'} w-4 h-4 rounded-full shrink-0 border border-white/10"></div>
                    <div class="flex-1 min-w-0">
                        <div class="text-base font-black text-amber-100 flex justify-between items-center">
                            <span class="truncate mr-2">${p.name}</span>
                            <div class="flex items-center gap-2 shrink-0">
                                <div class="bg-black/40 rounded-lg px-2 py-1 border border-amber-500/20 flex items-center gap-1">
                                    <span class="text-amber-500 text-xs">#</span>
                                    <span class="w-6 text-amber-100 font-black text-xs text-center">${p.count}</span>
                                </div>
                                <button onclick="event.stopPropagation(); window.deletePrize('${p.id}')" class="text-red-500/40 p-1 hover:text-red-500 hover:bg-red-950/50 rounded-lg transition-all"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            `}).join('');
            lucide.createIcons();
            renderStatusBadge();
        }

        function renderStatusBadge() {
            const selectedPrize = state.prizes.find(p => p.id === state.selectedPrizeId);
            if (selectedPrize) {
                els.statusBadge.classList.remove('hidden-el');
                const isRevealed = state.view === 'REVEALED';
                els.statusBadgeInner.className = `backdrop-blur-md px-10 py-3 rounded-full border-2 border-amber-400/50 shadow-2xl flex items-center gap-3 transition-colors duration-500 ${isRevealed ? 'bg-amber-600/90' : 'bg-red-800/90'}`;
                els.statusBadgeInner.innerHTML = `
                    <i data-lucide="${isRevealed ? 'party-popper' : 'sparkles'}" class="w-6 h-6 text-amber-300 shrink-0"></i>
                    <span class="text-amber-100 text-xl md:text-3xl font-black tracking-widest italic truncate whitespace-nowrap">
                        ${isRevealed ? `恭喜得獎 : ${selectedPrize.name}` : `正在抽取：${selectedPrize.name}`}
                    </span>
                    <i data-lucide="${isRevealed ? 'party-popper' : 'sparkles'}" class="w-6 h-6 text-amber-300 shrink-0"></i>
                `;
                lucide.createIcons();
            } else {
                els.statusBadge.classList.add('hidden-el');
            }
        }

        function renderStage() {
            // Hide all views first
            els.viewIdle.classList.add('hidden-el');
            els.viewDrawing.classList.add('hidden-el');
            els.viewRevealed.classList.add('hidden-el');
            
            if (state.view === 'IDLE') {
                els.viewIdle.classList.remove('hidden-el');
            } else if (state.view === 'DRAWING') {
                els.viewDrawing.classList.remove('hidden-el');
            } else if (state.view === 'REVEALED') {
                els.viewRevealed.classList.remove('hidden-el');
                renderRevealedResult();
            }
            renderStatusBadge();
        }

        function renderRevealedResult() {
            els.singleWinnerDisplay.classList.add('hidden-el');
            els.singleWinnerDisplay.classList.remove('flex-el'); // custom util
            els.batchWinnerDisplay.classList.add('hidden-el');

            if (state.currentBatch.length === 1) {
                const w = state.currentBatch[0];
                els.singleWinnerDisplay.classList.remove('hidden-el');
                els.singleWinnerDisplay.style.display = 'flex';
                els.singleWinnerName.textContent = w.name;
                els.singleWinnerTable.textContent = w.tableNumber || '貴賓';
            } else if (state.currentBatch.length > 1) {
                els.batchWinnerDisplay.classList.remove('hidden-el');
                els.batchGrid.innerHTML = state.currentBatch.map(w => `
                    <div class="relative overflow-hidden rounded-[2rem] bg-gradient-to-br from-red-900/90 to-black border border-amber-500/30 p-8 shadow-2xl transform hover:scale-[1.02] transition-all flex flex-col items-center justify-center min-h-[300px] w-full text-center group">
                        <div class="absolute inset-0 bg-amber-500/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
                        <div class="text-5xl font-black text-amber-50 mb-4 drop-shadow-md w-full break-words leading-tight relative z-10">${w.name}</div>
                        <div class="text-4xl font-bold text-amber-400 tracking-widest uppercase mt-2 flex items-center justify-center gap-2 border-t border-amber-500/20 pt-4 w-full relative z-10">
                            <span class="text-amber-500/50 text-xl">桌</span> ${w.tableNumber || '貴賓'}
                        </div>
                        <div class="text-sm text-amber-500/60 font-bold mt-4 relative z-10">${w.prizeName}</div>
                    </div>
                `).join('');
            }
            lucide.createIcons();
        }

        function renderWinners() {
            // Group winners
            const sorted = [...state.winners].sort((a, b) => b.drawnAt - a.drawnAt);
            const groups = [];
            let currentBatch = [];
            if (sorted.length > 0) {
                let batchTime = sorted[0].drawnAt;
                sorted.forEach(w => {
                    if (w.drawnAt !== batchTime) {
                        groups.push({ timestamp: batchTime, items: currentBatch });
                        currentBatch = [];
                        batchTime = w.drawnAt;
                    }
                    currentBatch.push(w);
                });
                if (currentBatch.length) groups.push({ timestamp: batchTime, items: currentBatch });
            }

            // Determine active tab
            if (groups.length > 0 && (!state.activeTabTimestamp || !groups.find(g => g.timestamp === state.activeTabTimestamp))) {
                state.activeTabTimestamp = groups[0].timestamp;
            }

            // Render Tabs
            if (groups.length > 0) {
                els.winnerTabs.innerHTML = groups.map(g => {
                    const isActive = g.timestamp === state.activeTabTimestamp;
                    const prizeName = g.items[0].prizeName;
                    const count = g.items.length;
                    return `
                        <button onclick="window.setActiveTab(${g.timestamp})" class="whitespace-nowrap px-6 py-2 rounded-full font-bold transition-all text-sm snap-start shrink-0 border ${isActive ? 'bg-amber-500 text-red-950 border-amber-400 shadow-[0_0_15px_rgba(245,158,11,0.4)]' : 'bg-transparent text-amber-500/70 border-amber-500/30 hover:border-amber-500 hover:text-amber-400'}">
                            ${prizeName} (${count})
                        </button>
                    `;
                }).join('');
            } else {
                els.winnerTabs.innerHTML = '';
            }

            // Render List
            const activeGroup = groups.find(g => g.timestamp === state.activeTabTimestamp);
            if (!activeGroup || activeGroup.items.length === 0) {
                els.winnerListContainer.innerHTML = `<div class="text-center py-24 text-amber-950 font-black italic text-3xl">虛位以待，開獎即見</div>`;
            } else {
                els.winnerListContainer.innerHTML = `<div class="animate-fade-in space-y-3">` + 
                    activeGroup.items.map(w => `
                        <div class="flex items-center gap-3 p-3 rounded-xl border transition-all ${w.verified ? 'bg-green-900/10 border-green-500/30 opacity-70' : 'bg-white/5 border-white/10'}">
                            <div class="flex-1 min-w-0">
                                <div class="flex items-baseline gap-2">
                                    <span class="text-xl md:text-2xl font-black text-amber-50 truncate leading-none">${w.name}</span>
                                    <span class="text-xs text-amber-500/50 hidden md:inline">(${w.prizeName})</span>
                                </div>
                                <div class="text-[10px] text-gray-500 mt-1 md:hidden truncate">${w.prizeName}</div>
                            </div>
                            <div class="shrink-0 text-right px-2 border-r border-white/10">
                                <div class="text-[9px] text-amber-500/50 uppercase font-bold tracking-wider leading-none mb-0.5">Table</div>
                                <div class="text-2xl md:text-3xl font-black text-amber-400 leading-none">${w.tableNumber || '-'}</div>
                            </div>
                            <div class="shrink-0 pl-1">
                                <button onclick="window.toggleVerify('${w.id}')" class="w-10 h-10 flex items-center justify-center rounded-lg transition-all ${w.verified ? 'text-green-400' : 'text-gray-600 hover:text-amber-500'}">
                                    <i data-lucide="${w.verified ? 'check-square' : 'square'}" class="w-8 h-8"></i>
                                </button>
                            </div>
                        </div>
                    `).join('') + `</div>`;
            }
            lucide.createIcons();
        }

        // --- Logic & Helpers ---

        function updateFirebase(path, data) {
            if (db) {
                db.ref(path).set(data);
            }
        }

        window.selectPrize = (id) => {
            state.selectedPrizeId = id;
            renderPrizes();
        };

        window.deletePrize = (id) => {
            if(confirm('確定要刪除此獎項嗎？')) {
                const newPrizes = state.prizes.filter(p => p.id !== id);
                updateFirebase('prizes', newPrizes);
                if (state.selectedPrizeId === id) state.selectedPrizeId = '';
            }
        };

        window.setActiveTab = (ts) => {
            state.activeTabTimestamp = ts;
            renderWinners();
        };

        window.toggleVerify = (id) => {
            const updated = state.winners.map(w => w.id === id ? {...w, verified: !w.verified} : w);
            updateFirebase('winners', updated);
        };

        // --- Event Listeners ---

        // Draw Logic
        document.getElementById('btn-start-draw').addEventListener('click', () => {
            const selectedPrize = state.prizes.find(p => p.id === state.selectedPrizeId);
            const count = parseInt(els.inputDrawCount.value) || 1;

            if (!selectedPrize) return alert('請先選擇一個獎項！');
            if (count < 1) return alert('至少 1 人');
            if (state.participants.length < count) return alert('參加者不足');
            if (selectedPrize.count < count) return alert('獎品數量不足');

            state.view = 'DRAWING';
            state.currentBatch = [];
            renderStage();

            // Animation
            const duration = 3000;
            const endTime = Date.now() + duration;
            const interval = setInterval(() => {
                if (Date.now() >= endTime) {
                    clearInterval(interval);
                    finalizeDraw(count, selectedPrize);
                } else {
                    const randomP = state.participants[Math.floor(Math.random() * state.participants.length)];
                    els.rollingName.textContent = randomP.name;
                    els.rollingTable.textContent = randomP.tableNumber || '??';
                }
            }, 50);
        });

        async function finalizeDraw(count, prize) {
            const candidates = [...state.participants];
            const luckies = [];
            for (let i = 0; i < count; i++) {
                const idx = Math.floor(Math.random() * candidates.length);
                luckies.push(candidates.splice(idx, 1)[0]);
            }

            const timestamp = Date.now();
            if(window.confetti) window.confetti({ particleCount: 150, spread: 90, origin: { y: 0.5 }, colors: ['#ffd700', '#ff0000', '#ffffff'] });

            const newWinners = luckies.map(l => ({
                id: l.id,
                name: l.name,
                tableNumber: l.tableNumber,
                prizeName: prize.name,
                drawnAt: timestamp,
                verified: false,
                aiMessage: getRandomMessage() // Use static message instead of AI
            }));

            // Sort by table
            newWinners.sort((a,b) => (a.tableNumber || '').localeCompare(b.tableNumber || '', undefined, {numeric: true}));

            // Update State
            state.currentBatch = newWinners;
            state.view = 'REVEALED';
            
            // Sync Firebase
            if (db) {
                const updates = {};
                updates['winners'] = [...state.winners, ...newWinners];
                updates['participants'] = candidates;
                updates['prizes'] = state.prizes.map(p => p.id === prize.id ? {...p, count: Math.max(0, p.count - count)} : p);
                db.ref().update(updates);
            }
            
            renderStage();
        }

        // Nav Buttons
        document.getElementById('btn-draw-again').addEventListener('click', () => { state.view = 'IDLE'; renderStage(); });
        document.getElementById('btn-home').addEventListener('click', () => { state.view = 'IDLE'; renderStage(); });

        // Add User
        document.getElementById('btn-toggle-add-user').addEventListener('click', () => els.addUserForm.classList.toggle('hidden-el'));
        document.getElementById('btn-submit-user').addEventListener('click', () => {
            const name = els.inputName.value.trim();
            const table = els.inputTable.value.trim();
            if (name) {
                const p = { id: Math.random().toString(36).substring(2), name, tableNumber: table, addedAt: Date.now() };
                updateFirebase('participants', [...state.participants, p]);
                els.inputName.value = ''; els.inputTable.value = '';
                els.addUserForm.classList.add('hidden-el');
            }
        });

        // Add Prize
        document.getElementById('btn-toggle-add-prize').addEventListener('click', () => els.addPrizeForm.classList.toggle('hidden-el'));
        document.getElementById('btn-submit-prize').addEventListener('click', () => {
            const name = els.inputPrizeName.value.trim();
            const count = parseInt(els.inputPrizeCount.value) || 1;
            if (name) {
                const p = { id: Math.random().toString(36).substring(2), name, count };
                updateFirebase('prizes', [...state.prizes, p]);
                els.inputPrizeName.value = ''; els.inputPrizeCount.value = 1;
                els.addPrizeForm.classList.add('hidden-el');
            }
        });

        // Resets
        document.getElementById('btn-global-reset').addEventListener('click', () => {
            if(confirm('⚠️ 系統重置：清空所有資料？')) {
               if(db) db.ref('/').set({ participants: [], prizes: [], winners: [] });
               window.location.reload(); 
            }
        });
        document.getElementById('btn-clear-participants').addEventListener('click', () => {
            if(confirm('清空名單？')) updateFirebase('participants', []);
        });
        document.getElementById('btn-clear-winners').addEventListener('click', () => {
            if(confirm('清空紀錄？')) updateFirebase('winners', []);
        });

        // Info Modal
        document.getElementById('btn-info').addEventListener('click', () => document.getElementById('modal-info').classList.remove('hidden-el'));

        // Excel Imports
        document.getElementById('file-participants').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const wb = XLSX.read(evt.target.result, {type: 'binary'});
                const ws = wb.Sheets[wb.SheetNames[0]];
                const data = XLSX.utils.sheet_to_json(ws, {header:1});
                const newP = data.slice(1).map(row => ({
                    id: Math.random().toString(36).substring(2),
                    name: String(row[0]||'').trim(),
                    tableNumber: String(row[1]||'').trim(),
                    addedAt: Date.now()
                })).filter(x => x.name);
                updateFirebase('participants', [...state.participants, ...newP]);
                e.target.value = '';
            };
            reader.readAsBinaryString(file);
        });

        document.getElementById('file-prizes').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const wb = XLSX.read(evt.target.result, {type: 'binary'});
                const ws = wb.Sheets[wb.SheetNames[0]];
                const data = XLSX.utils.sheet_to_json(ws, {header:1});
                const newP = data.slice(1).map(row => ({
                    id: Math.random().toString(36).substring(2),
                    name: String(row[0]||'').trim(),
                    count: parseInt(row[1]||1)
                })).filter(x => x.name);
                updateFirebase('prizes', [...state.prizes, ...newP]);
                e.target.value = '';
            };
            reader.readAsBinaryString(file);
        });

        // Export
        document.getElementById('btn-export').addEventListener('click', () => {
            if (state.winners.length === 0) return alert('無資料');
            const data = state.winners.map(w => ({
                '姓名': w.name, '桌次': w.tableNumber, '獎項': w.prizeName, '狀態': w.verified ? '已領' : '未領', '賀詞': w.aiMessage
            }));
            const ws = XLSX.utils.json_to_sheet(data);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Winners");
            XLSX.writeFile(wb, `Winners_${Date.now()}.xlsx`);
        });

        // --- Firebase Listeners ---
        if (db) {
            db.ref('participants').on('value', snap => {
                state.participants = snap.val() || [];
                renderParticipants();
            });
            db.ref('prizes').on('value', snap => {
                state.prizes = snap.val() || [];
                renderPrizes();
            });
            db.ref('winners').on('value', snap => {
                state.winners = snap.val() || [];
                renderWinners();
            });
        }
        
        // Initial Icon Render
        lucide.createIcons();
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
